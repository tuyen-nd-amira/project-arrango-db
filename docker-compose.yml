services:

  # ── ArangoDB ────────────────────────────────────────────────
  arangodb:
    image: arangodb:3.12
    container_name: cinema_arangodb
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD:-123456}
    ports:
      - "8529:8529"
    volumes:
      - arangodb_data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD", "arangosh", "--server.endpoint", "http+tcp://127.0.0.1:8529", "--server.username", "root", "--server.password", "${ARANGO_PASSWORD:-123456}", "--javascript.execute-string", "db._version()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── Spring Boot App ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinema_app
    ports:
      - "8080:8080"
    environment:
      ARANGO_HOST: arangodb
      ARANGO_PORT: 8529
      ARANGO_DATABASE: ${ARANGO_DATABASE:-cinema_db}
      ARANGO_USER: ${ARANGO_USER:-root}
      ARANGO_PASSWORD: ${ARANGO_PASSWORD:-123456}
      APP_SEED_MODE: ${APP_SEED_MODE:-reset}
      APP_SEED_RESET_USERS: ${APP_SEED_RESET_USERS:-false}
      JWT_SECRET: ${JWT_SECRET:-CinemaBookSuperSecretKeyForJwtAccessToken_2026_ChangeThis}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-2592000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      arangodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  arangodb_data:
