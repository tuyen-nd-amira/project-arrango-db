<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt vé – CinemaBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <!-- Breadcrumb -->
  <div style="background:#111;border-bottom:1px solid #2a2a2a;padding:10px 0">
    <div class="container">
      <span class="text-muted" style="font-size:0.88rem">
        <a href="/" style="color:#aaa;text-decoration:none">Trang chủ</a>
        <span class="mx-2">›</span>
        <a href="/movies.html" style="color:#aaa;text-decoration:none">Phim</a>
        <span class="mx-2">›</span>
        <span id="breadcrumb-movie" style="color:#e50914">Đặt vé</span>
      </span>
    </div>
  </div>

  <div class="container py-4">
    <div id="booking-content">
      <div class="text-center py-5"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Success Modal -->
  <div id="success-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center">
    <div style="background:#1f1f1f;border:1px solid #27ae60;border-radius:16px;padding:40px;max-width:480px;width:90%;text-align:center">
      <div style="font-size:4rem">🎉</div>
      <h3 class="fw-bold mt-3" style="color:#27ae60">Đặt vé thành công!</h3>
      <p class="text-muted mt-2" id="modal-message"></p>
      <div id="modal-rank-update" class="my-3" style="display:none">
        <span class="rank-badge" id="modal-new-rank"></span>
        <small class="text-muted d-block mt-1">Hạng thành viên đã được cập nhật!</small>
      </div>
      <div class="mt-4 d-flex gap-3 justify-content-center">
        <a href="/movies.html" class="btn-outline-custom">Đặt thêm vé</a>
        <a href="/" class="btn-primary-custom">Về trang chủ</a>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=20260505-profile-fix"></script>
  <script src="/js/booking.js?v=20260505-ai-review-fix"></script>
</body>
</html>
