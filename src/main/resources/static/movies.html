<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách phim – CinemaBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="container py-5">
    <!-- Header -->
    <div class="row align-items-center mb-4">
      <div class="col">
        <h2 class="section-title mb-0">🎬 Danh sách phim</h2>
      </div>
      <div class="col-md-4">
        <input id="search-input" type="text" class="form-control-custom"
               placeholder="🔍 Tìm kiếm phim...">
      </div>
    </div>

    <!-- Genre filters -->
    <div class="d-flex flex-wrap gap-2 mb-4" id="genre-filters">
      <button class="genre-btn active" data-genre="">Tất cả</button>
    </div>

    <!-- Movie grid -->
    <div id="movies-grid" class="row g-4">
      <div class="col-12 text-center py-5"><div class="spinner"></div></div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=20260505-profile-fix"></script>
  <script src="/js/movies.js"></script>
</body>
</html>
