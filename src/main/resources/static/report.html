<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo cáo doanh thu – CinemaBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <style>
    .report-card {
      background: var(--dark-card);
      border: 1px solid var(--dark-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
    }
    .stat-box {
      background: var(--dark-card);
      border: 1px solid var(--dark-border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .stat-box .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary);
    }
    .stat-box .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted-custom);
      margin-top: 4px;
    }
    .revenue-table th {
      background: #f1f5f9;
      font-weight: 700;
      font-size: 0.88rem;
      color: #374151;
      border-bottom: 2px solid var(--dark-border);
      padding: 12px 16px;
    }
    .revenue-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--dark-border);
      vertical-align: middle;
      font-size: 0.9rem;
    }
    .revenue-table tr:last-child td { border-bottom: none; }
    .revenue-table tr:hover td { background: #fafafa; }
    .rank-badge-table {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .revenue-bar-wrap {
      background: #e5e7eb;
      border-radius: 6px;
      height: 8px;
      min-width: 80px;
    }
    .revenue-bar {
      background: var(--primary);
      border-radius: 6px;
      height: 8px;
      transition: width 0.5s ease;
    }
    .top-badge {
      font-size: 1.2rem;
      margin-right: 4px;
    }
    .sort-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      font-size: 0.75rem;
      margin-left: 4px;
      padding: 0;
    }
    .sort-btn.active { color: var(--primary); }
    #search-report {
      background: #fff;
      border: 1px solid var(--dark-border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.9rem;
      width: 240px;
    }
    #search-report:focus { outline: 2px solid var(--primary); }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="container py-5">
    <!-- Tiêu đề -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
      <h2 class="section-title mb-0">📊 Báo cáo doanh thu phim</h2>
      <div class="d-flex align-items-center gap-2">
        <input id="search-report" type="text" placeholder="🔍 Tìm phim...">
        <button class="btn-outline-custom" onclick="loadReport()">🔄 Làm mới</button>
      </div>
    </div>

    <!-- Thống kê tổng quan -->
    <div class="row g-3 mb-4" id="overview-stats">
      <div class="col-6 col-md-3">
        <div class="stat-box">
          <div class="stat-value" id="ov-revenue">–</div>
          <div class="stat-label">Tổng doanh thu</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-box">
          <div class="stat-value" id="ov-tickets">–</div>
          <div class="stat-label">Vé đã bán</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-box">
          <div class="stat-value" id="ov-bookings">–</div>
          <div class="stat-label">Lượt đặt</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-box">
          <div class="stat-value" id="ov-users">–</div>
          <div class="stat-label">Thành viên</div>
        </div>
      </div>
    </div>

    <!-- Bảng doanh thu từng phim -->
    <div class="report-card">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">🎬 Doanh thu theo từng phim</h5>
        <span class="text-muted small" id="movie-count"></span>
      </div>
      <div id="report-table-wrap">
        <div class="text-center py-5"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=20260504-jwt-fix"></script>
  <script src="/js/report.js"></script>
</body>
</html>
